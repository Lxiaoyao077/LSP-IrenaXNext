[versions]
agp = "9.4.1"
kotlin = "2.4.20"
nav = "2.9.8"
glide = "5.0.9"
okhttp = "5.3.2"
startupRuntime = "1.2.0"
ndk = "29.0.13599879-beta2"

compose-bom = "2026.08.00"
m3 = "1.5.0-alpha29"
lifecycle = "2.11.0"
nav3 = "1.1.6"
coroutines = "1.11.0"
coil = "3.5.0"
navigationevent = "1.1.2"
[plugins]
agp-lib = { id = "com.android.library", version.ref = "agp" }
agp-app = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
nav-safeargs = { id = "androidx.navigation.safeargs", version.ref = "nav" }
autoresconfig = { id = "dev.rikka.tools.autoresconfig", version = "ebd7e1ec68c89ac38fc2d675786dd120d64653aa" }
materialthemebuilder = { id = "dev.rikka.tools.materialthemebuilder", version = "63f1f189450912baade92876965396ebf1615d4e" }
